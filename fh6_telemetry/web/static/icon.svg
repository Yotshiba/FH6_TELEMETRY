<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FH6 Telemetry">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#080814"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#44ccff"/><stop offset="0.62" stop-color="#44ccff"/>
      <stop offset="0.8" stop-color="#ff9900"/><stop offset="1" stop-color="#ff3c3c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 270° dial: from 135° to 405° around (256, 276), radius 168 -->
  <path d="M 137 395 A 168 168 0 1 1 375 395" fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="butt"/>
  <g stroke="#cfd6e6" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="164" y1="368" x2="184" y2="348"/><line x1="256" y1="96" x2="256" y2="124"/><line x1="348" y1="368" x2="328" y2="348"/>
  </g>
  <!-- needle at ~72 % of the sweep -->
  <polygon points="236,288 396,176 400,184 250,300" fill="#ff3c3c" transform="rotate(8 256 276)"/>
  <circle cx="256" cy="276" r="28" fill="#f0f4ff"/><circle cx="256" cy="276" r="15" fill="#3c4664"/>
</svg>
