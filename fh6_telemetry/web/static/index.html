<!doctype html>
<html lang="en" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d1a">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FH6 Telemetry">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>FH6 Telemetry</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/extras.css">
<link rel="stylesheet" href="/static/themes.css">
</head>
<body>
<div id="shake">
  <header id="top">
    <div id="brand">FH6<span>TELEMETRY</span></div>
    <nav id="tabs" role="tablist" aria-label="Views"></nav>
    <button id="btn-awake" class="icon-btn" type="button" aria-label="Keep screen on" aria-pressed="false" title="Keep the screen on">☀</button>
    <button id="btn-settings" class="icon-btn" type="button" aria-label="Settings" title="Settings">⚙</button>
    <div id="conn" class="conn conn-connecting" title="Connection">
      <span id="conn-dot"></span><span id="conn-text">Connecting…</span>
    </div>
  </header>
  <main id="views"></main>
</div>
<div id="vignette" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toasts" aria-live="polite"></div>
<div id="backdrop"></div>
<aside id="drawer" aria-label="Settings" aria-hidden="true"></aside>
<noscript><p style="padding:2rem">This dashboard needs JavaScript.</p></noscript>
<script type="module" src="/static/app.js"></script>
</body>
</html>
